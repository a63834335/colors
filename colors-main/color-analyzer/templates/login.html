{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth">
  <h2>Вход</h2>
  <form method="post" action="{{ url_for('login') }}">
    <label>Имя пользователя<input name="username" required></label>
    <label>Пароль<input type="password" name="password" required></label>
    <button class="btn primary" type="submit">Войти</button>
  </form>
  <div class="alt">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></div>
</div>
{% endblock %}
