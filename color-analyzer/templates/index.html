{% extends 'base.html' %}
{% block content %}
<div class="userbar">
  <div class="avatar"></div>            <!-- аккаунт (заглушка) -->
  <span class="name">аккаунт</span>
  <a class="btn" href="{{ url_for('palettes') }}">Мои палитры</a>
</div>

<!-- ДЕНЬ 2: форма-заглушка, action="#" — страница просто перезагрузится, ничего не сломается -->
<form class="layout" action="#" method="post" enctype="multipart/form-data">
  <div class="dropzone">
    <div>Загрузите сюда ваше фото</div>
    <input type="file" name="photo" id="photo" accept="image/*">
    <span id="fname" style="font-size:13px"></span>
  </div>

  <div class="mid">
    <label for="colors_count">Введите количество цветов:</label>
    <input type="number" id="colors_count" name="colors_count" min="1" max="16" value="5">
    <button class="btn primary" type="submit">Получить палитру</button>
  </div>

  <div>
    <div class="panel">
      <h2>Палитра цветов</h2>
      <!-- заглушки строк палитры, как в эскизе -->
      <div class="pal-item"><span class="swatch"></span><div class="info">название цвета<br>HEX-код цвета</div></div>
      <div class="pal-item"><span class="swatch"></span><div class="info">название цвета<br>HEX-код цвета</div></div>
      <div class="pal-item"><span class="swatch"></span><div class="info">название цвета<br>HEX-код цвета</div></div>
    </div>
    <div class="save-form">
      <button class="btn primary" type="button">Сохранить палитру</button>
    </div>
  </div>
</form>

<script>
// единственная живая деталь прототипа: показывает имя выбранного файла
const fi = document.getElementById('photo');
if (fi) fi.addEventListener('change', () => {
  document.getElementById('fname').textContent = fi.files[0] ? fi.files[0].name : '';
});
</script>
{% endblock %}
