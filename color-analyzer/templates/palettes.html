{% extends 'base.html' %}
{% block title %}Мои палитры{% endblock %}
{% block content %}
<div class="userbar">
  <div class="avatar">{{ session['username'][0].upper() }}</div>
  <span class="name">{{ session['username'] }}</span>
  <a class="btn" href="{{ url_for('index') }}">Анализ фото</a>
  <form method="post" action="{{ url_for('logout') }}" style="margin:0">
    <button class="btn" type="submit">Выйти</button>
  </form>
</div>
<p class="empty">
Сейчас результат анализа показывается на главной странице.</p>
{% endblock %}
