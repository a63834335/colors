{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth">
  <h2>Регистрация</h2>
  <form action="#" method="post">
    <label>Имя пользователя<input name="username"></label>
    <label>Пароль<input type="password" name="password"></label>
    <button class="btn primary" type="submit">Создать аккаунт</button>
  </form>
  <p class="stub-note">Логика регистрации появится на дне 3. <a href="{{ url_for('login') }}">Вход</a></p>
</div>
{% endblock %}
