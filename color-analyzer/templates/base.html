<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{% block title %}Палитра цветов по фотографии{% endblock %}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f7f9fb;color:#222}
.topbar{background:#d9d9d9;padding:26px 20px;text-align:center}
.topbar h1{margin:0;font-size:22px;font-weight:600}
.userbar{display:flex;align-items:center;gap:14px;padding:18px 40px}
.avatar{width:46px;height:46px;border-radius:50%;background:#d9d9d9}
.userbar .name{margin-right:auto;font-size:14px;color:#555}
.btn{display:inline-block;background:#d9d9d9;border:none;border-radius:6px;padding:10px 16px;font-size:14px;color:#222;cursor:pointer;text-decoration:none}
.btn:hover{background:#c8c8c8}
.btn.primary{background:#4a76a8;color:#fff}
.layout{display:grid;grid-template-columns:1fr 240px 1fr;gap:32px;padding:0 40px 48px;align-items:start}
.dropzone{background:#d9d9d9;border-radius:4px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center}
.dropzone input[type=file]{font-size:13px;max-width:100%}
.mid{padding-top:6px}
.mid label{display:block;margin-bottom:8px;font-size:16px}
.mid input[type=number]{width:100%;padding:10px;border:1px solid #bbb;border-radius:4px;font-size:15px;margin-bottom:14px}
.panel{background:#d9d9d9;border-radius:4px;padding:18px}
.panel h2{margin:0 0 14px;font-size:18px;text-align:center;font-weight:600}
.pal-item{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.swatch{width:36px;height:36px;border-radius:50%;flex:none;background:#000}
.pal-item .info{font-size:14px;line-height:1.45;color:#333}
.save-form{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.auth{max-width:360px;margin:60px auto;background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:26px}
.auth h2{margin-top:0}
.auth label{display:block;margin:12px 0 6px;font-size:14px}
.auth input{width:100%;padding:10px;border:1px solid #bbb;border-radius:4px;font-size:14px}
.auth .btn{margin-top:16px;width:100%}
.stub-note{color:#888;font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="topbar"><h1>Палитра цветов по фотографии</h1></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
